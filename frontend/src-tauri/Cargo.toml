[package]
name = "maity-desktop"
version = "0.2.59"
description = "A Tauri App for meeting minutes"
authors = ["Sujith S"]
license = "MIT"
repository = "https://github.com/Zackriya-Solutions/meeting-minutes"
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


# Hardware acceleration features for whisper-rs
# Cross-platform GPU acceleration with smart defaults
#
# BUILD INSTRUCTIONS:
# ===================
# macOS:     cargo build --release              (Metal GPU auto-enabledon)
#
# Windows:   cargo build --release              (CPU with OpenBLAS)
#            cargo build --release --features cuda    (NVIDIA GPU)
#            cargo build --release --features vulkan  (AMD/Intel GPU)
#
# Linux:     cargo build --release              (CPU with OpenBLAS)
#            cargo build --release --features cuda    (NVIDIA GPU)
#            cargo build --release --features hipblas (AMD GPU with ROCm)
#            cargo build --release --features vulkan  (Other GPUs)
#
# QUICK START: Use the helper scripts!
#   ./build-gpu.sh (Unix/macOS)
#   .\build-gpu.ps1 (Windows PowerShell)
#
[features]
default = ["platform-default"]  # Automatically enables best backend per platform

# Platform-appropriate defaults - see target-specific dependencies below
platform-default = []

# Manual GPU acceleration options (for power users to override defaults)
metal = ["whisper-rs/metal"]       # macOS: Apple Metal GPU (Auto-enabled on macOS)
coreml = ["whisper-rs/coreml"]     # macOS: Apple CoreML acceleration
cuda = ["whisper-rs/cuda"]         # Windows/Linux: NVIDIA CUDA GPU
vulkan = ["whisper-rs/vulkan"]     # Windows/Linux: AMD/Intel Vulkan GPU
hipblas = ["whisper-rs/hipblas"]   # Linux: AMD ROCm HIP

# CPU optimizations (fallback for systems without GPU)
openblas = ["whisper-rs/openblas"] # Optimized BLAS (Auto-enabled on Windows/Linux)
openmp = ["whisper-rs/openmp"]     # OpenMP parallel processing

# ONNX Runtime (Parakeet / Moonshine / Canary). NO es de whisper-rs como los de arriba,
# por eso el prefijo `onnx-`. APAGADO por defecto desde sep-2026 (#33 de la auditoría
# de recursos): el motor por defecto, Parakeet, corre en CPU por decisión medida
# (docs/AB_PARAKEET_EP_2026-07-20.md) y solo Moonshine/Canary piden GPU. Sin este
# feature `DirectMLExecutionProvider::register()` no tiene cuerpo y `onnx_providers.rs`
# ni siquiera lo pide: los tres motores corren en CPU. Activarlo NO cambia qué código
# entra al exe (el prebuilt de pyke ya trae DML compilado; ver docs/ONNX_EXECUTION_PROVIDERS.md)
# y el delay-load de los DLLs de DirectX vive en build.rs, independiente de esto.
#   tauri build --features onnx-directml      (o TAURI_GPU_FEATURE="vulkan,onnx-directml")
onnx-directml = ["ort/directml"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }
# build.rs sólo usa `which` (detección de nvidia-smi/rocm-smi). El reqwest que vivía aquí
# compilaba una pila HTTP+TLS entera para el host sin un solo uso (#35 de la auditoría).
which = "6.0.1"


[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
once_cell = "1.17.1"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Cross-platform audio capture. Versión PUBLICADA: el `[patch.crates-io]` al fork
# RustAudio/cpal@51c3b43 (master del 2025-02-16, sin release) heredado de Meetily
# vivía en este archivo y Cargo lo ignoraba por no ser la raíz del workspace, así
# que nunca entró a ningún binario de Maity. Retirado en #31 de la auditoría de
# recursos (sep-2026). Subir cpal (0.16+ trae el fix #946 de CoreAudio) es una
# actualización de dependencia aparte, con smoke de captura y hot-swap.
cpal = "0.15.3"

# Wav encoding - now using manual WAV creation instead of hound
# hound = "3.5"

# Dates
chrono = { version = "0.4.31", features = ["serde"] }

# Log
log = "0.4"
env_logger = "0.11"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
# NormalizeEvent para el puente rust_error_bridge: los eventos bridgeados de
# `log::` llevan metadata.target()=="log"; el target real requiere normalizar.
tracing-log = "0.2"

# Zip for log export. Misma major que tauri-plugin-updater y ffmpeg-sidecar para no
# compilar dos `zip`; sólo `deflate` (es lo único que usa logging/commands.rs).
zip = { version = "4", default-features = false, features = ["deflate"] }

# Crash reporting. `rustls-no-provider`, NO `rustls`: en sentry ≥0.47 la feature `rustls`
# activa `reqwest/rustls`, que en reqwest 0.13 enciende aws-lc-rs → dos proveedores
# criptográficos en el árbol y panic al primer HTTPS. El proveedor (ring) se instala en
# main.rs. Ver CLAUDE.md § "Dependencias Rust: una sola pila TLS".
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls-no-provider"] }
which = "6.0.1"

# Bytes
bytemuck = "1.16.1"

# EBU R128 loudness normalization (professional broadcast standard)
ebur128 = "0.1"

# Noise suppression - RNNoise-based neural network noise reduction.
# Sin default features: `default = ["bin", "dasp"]` y `bin` arrastra clap 3 + hound para un
# ejecutable que nunca se construye. El código sólo usa `DenoiseState` (audio_processing.rs).
nnnoiseless = { version = "0.5", default-features = false }

# Speech recognition and async utilities
# NOTE: whisper-rs is declared in platform-specific sections below (macOS/Windows/Linux)
# to ensure correct GPU features are enabled per platform
futures-util = "0.3"
# Copia vendorizada de emotechlab/silero-rs @ 1283485 con parches locales (hallazgo #01 de la
# auditoría de recursos: `take_until` + `SpeechEnd` hacía panic en upstream). Ver vendor/silero-rs/src/lib.rs.
silero_rs = { path = "vendor/silero-rs", package = "silero" }

# Parakeet (ONNX-based fast transcription) dependencies
ort = { version = "2.0.0-rc.10" }  # ONNX Runtime for Parakeet models
thiserror = "2.0.16"                # Error handling for Parakeet

# Moonshine (UsefulSensors edge-optimized transcription) dependencies
# Note: Using custom JSON-based tokenizer parser to avoid C++ runtime conflicts on Windows

# Async
tokio = { version = "1.32.0", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process", "tracing"] }
tokio-util = "0.7"  # Utilities for tokio including CancellationToken
async-trait = "0.1"  # Trait abstraction for async methods

# WebSocket for cloud transcription providers (Deepgram). ≥0.24 usa rustls 0.23; el 0.21
# traía su propia pila (rustls 0.22 + tokio-rustls 0.25 + rustls-native-certs 0.7).
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures = "0.3"  # Stream utilities for WebSocket

# reqwest 0.13 renombró las features TLS: `rustls-tls` → `rustls` (que ADEMÁS enciende
# aws-lc-rs) y las `*-native-roots`/`*-webpki-roots` desaparecieron (siempre
# rustls-platform-verifier = verificador del SO, el mismo que ya usaba el updater).
# `rustls-no-provider` deja la elección del proveedor a main.rs (ring). Sin `multipart`
# (cero usos) ni `system-proxy` (el 0.12 sin defaults sólo leía HTTPS_PROXY del entorno y
# eso se conserva; leer el proxy del registro de Windows sería un cambio silencioso).
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "stream", "rustls-no-provider"] }
# Proveedor criptográfico único del proceso: `rustls::crypto::ring::default_provider()
# .install_default()` en main.rs. Sin esto `ClientConfig::builder()` elige ring sólo porque
# es la única feature de proveedor en la unión del árbol (la enciende tauri-plugin-updater);
# el día que una dep active `aws-lc-rs`, TODO HTTPS haría panic en el primer request.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# crossbeam
crossbeam = "0.8.4"
dashmap = "6.1.0"

# Directories (misma major que tauri: dirs 5 duplicaba dirs-sys y windows-sys 0.48)
dirs = "6"

# Decodificacion del payload que manda el WebView al guardar artefactos del chat
# (.md/.pdf/.pptx). Ya estaba resuelto transitivamente en Cargo.lock.
base64 = "0.22"

# Additional dependencies for notification system
url = "2.5.0"


# System monitoring for resource management
sysinfo = "0.32"

lazy_static = { version = "1.4.0" }
realfft = "3.4.0"
rustfft = "6.2"  # FFT complejo del preprocessor de Canary (log-mel); realfft ya lo trae transitivo
regex = "1.11.0"
ndarray = "0.16"
bytes = { version = "1.9.0", features = ["serde"] }

rand = "0.8.5"
sha2 = "0.10"  # verificación de integridad del manifiesto de modelos Parakeet
rubato = "0.15.0"
ringbuf = "0.4.8"

ffmpeg-sidecar = { git = "https://github.com/nathanbabcock/ffmpeg-sidecar", rev = "a4d189d46aba70c22cf18ad49276caaf6c7a0e58" }

sqlx = { version = "0.8", features = [ "runtime-tokio", "sqlite", "chrono"] }

# Common Tauri configuration
tauri = { version = "2.11", features = [ "macos-private-api", "protocol-asset", "tray-icon"] }
tauri-plugin-fs = "2.5.0"
tauri-plugin-dialog = "2.3.0"
tauri-plugin-store = "2.4.0"
tauri-plugin-notification = "2.3.1"
tauri-plugin-updater = "2.10.0"
tauri-plugin-process = "2.3.0"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-autostart = "2"

# macOS-specific dependencies with Metal GPU acceleration
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.11", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
once_cell = "1.17.1"
objc = "0.2.7"
tauri-plugin-log = { version = "2.6.0", features = ["colored"] }
anyhow = "1.0"
time = { version = "0.3", features = ["formatting"] }
core-graphics = "0.24"
# IMPORTANTE: `default-features = false` es obligatorio. Los default features de cidre
# son `full`, que enciende sus ~50 modulos — incluido `am` (Apple Mobile Device), que
# declara `#[link(name = "MobileDevice", kind = "framework")]` y mete un LC_LOAD_DYLIB a
# /System/Library/PrivateFrameworks/MobileDevice.framework en el binario. Apple rechazo
# la app por eso (Guideline 2.5.1, jul-2026) aunque no llamamos ni un simbolo de ese
# framework. `full` ademas enciende la feature `private` de cidre via `am`.
# Solo listamos lo que realmente usa el codigo de audio (arc/os no llevan feature):
#   av + cat + cf + core_audio + ns  →  audio/capture/core_audio.rs, system_detector.rs,
#                                        device_detection.rs, diagnostics.rs
# `av` ya arrastra ns → objc + cg → cf, por eso no hace falta listarlos.
# NO reintroducir `am` ni `private`: verificar con
#   otool -L <bin> | grep -i PrivateFrameworks   (debe salir vacio)
cidre = { git = "https://github.com/yury/cidre", rev = "a9587fa", default-features = false, features = [
    "av",
    "cat",
    "cm",       # av lo necesita cuando `blocks` esta activo, pero no lo declara (bug de features de cidre)
    "app",      # AppKit: ns::RunningApp en audio/system_detector.rs
    "core_audio",
    "blocks",
    "async",
    "macos_15_0",
    "half",
] }
dasp = "0.11.0"
futures-channel = "0.3.31"

# PERFORMANCE: Enable Metal GPU + CoreML acceleration automatically on macOS
# CoreML provides additional acceleration for Apple Silicon chips
whisper-rs = { version = "0.13.2", features = ["raw-api", "metal", "coreml"] }

# ONNX Runtime con CoreML EP para Parakeet/Moonshine/Canary (Apple Silicon / ANE).
# Hereda los default features (incluye download-binaries) y suma el binding CoreML.
ort = { version = "2.0.0-rc.10", features = ["coreml"] }

# Windows-specific dependencies
# Default: CPU-only build (no BLAS)
# Users can enable features manually:
#   --features cuda     (NVIDIA GPUs)
#   --features vulkan   (AMD/Intel GPUs)
#   --features openblas (OpenBLAS optimization, requires BLAS_INCLUDE_DIRS)
[target.'cfg(target_os = "windows")'.dependencies]
# CPU-only build (Vulkan disabled for easier compilation)
whisper-rs = { version = "0.13.2", features = ["raw-api"] }
futures-channel = "0.3.31"
# ONNX Runtime para Parakeet/Moonshine/Canary. SIN el feature `directml` desde sep-2026
# (#33 de la auditoría de recursos): el prebuilt que baja `download-binaries` para
# x86_64-pc-windows-msvc es UNO solo (fila `none` de ort-sys/dist.txt, no existe variante
# "directml") y ya trae el provider DML compilado; el feature solo daba cuerpo a
# `DirectMLExecutionProvider::register()`. Hoy se enciende con el feature de la app
# `onnx-directml` (ver [features]); el delay-load de DirectML/D3D12/DXGI/DXCORE lo hace
# build.rs y no depende de esto. Detalle: docs/ONNX_EXECUTION_PROVIDERS.md.
ort = { version = "2.0.0-rc.10" }
# WASAPI for system audio capture (loopback) - captura audio de videollamadas
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_Devices_Properties",
    # Property store de los endpoints de audio (bluetooth_guard.rs): leer
    # PKEY_Device_EnumeratorName para saber si un endpoint es BTHENUM/BTHLEENUM
    # SIN activar el IAudioClient (activarlo conmutaría el headset a HFP).
    "Win32_Devices_FunctionDiscovery",   # PKEY_Device_EnumeratorName / FriendlyName
    "Win32_UI_Shell_PropertiesSystem",   # IPropertyStore, PROPERTYKEY
    "Win32_System_Com_StructuredStorage",# PropVariantToStringAlloc
    "Win32_System_Threading",   # Para eventos de sincronización
    "Win32_Security",           # Para CreateEventW
    "Win32_Storage_Packaging_Appx",  # GetCurrentPackageFullName (detección MSIX/Store)
    "implement",                # Para implementar interfaces COM
    # StartupTask del canal Store/MSIX (ver startup_task.rs): detección de
    # activación al boot + toggle de Settings sobre Windows.ApplicationModel.
    "ApplicationModel",             # StartupTask, StartupTaskState, AppInstance
    "ApplicationModel_Activation",  # IActivatedEventArgs, ActivationKind
    "Foundation",                   # IAsyncOperation<T>::get()
    "Foundation_Collections",       # gating de métodos de AppInstance (IVectorView)
] }
# Lectura/escritura del registro de Windows para detectar y limpiar la instalación
# rival (NSIS de descarga directa) cuando Maity corre bajo MSIX/Store. Ver rival_install.rs.
# ≥0.55 usa windows-sys 0.59-0.61 (ya en el árbol); el 0.52 era el último ancla de 0.48.
winreg = "0.56"
# Toast nativo con el AUMID resuelto EN RUNTIME (ver notifications/toast.rs). Es la MISMA
# crate y versión que tauri-plugin-notification usa por dentro (vía notify-rust, que pide
# "0.7"), así que Cargo unifica a un solo tauri-winrt-notification 0.7.2: cero paquetes
# nuevos, cero unidades de compilación extra. La declaramos directa porque el plugin fija
# el app_id del toast a `config.identifier` ("com.maity.ai") y bajo identidad de paquete
# ese AUMID es ajeno → Windows rechaza el toast.
tauri-winrt-notification = "0.7"

# Linux-specific dependencies
# Default: CPU-only build (no BLAS)
# Users can enable features manually:
#   --features cuda     (NVIDIA GPUs)
#   --features vulkan   (AMD/Intel GPUs)
#   --features hipblas  (AMD ROCm)
#   --features openblas (OpenBLAS optimization, requires BLAS_INCLUDE_DIRS)
[target.'cfg(target_os = "linux")'.dependencies]
whisper-rs = { version = "0.13.2", features = ["raw-api"] }
futures-channel = "0.3.31"

[dev-dependencies]
tempfile = "3.3.0"
# `start_paused` en tests del sidecar (handshake / ventana fría / strikes) —
# resolver 2: la feature NO se filtra al build normal.
tokio = { version = "1.32.0", features = ["test-util"] }
infer = "0.15"
criterion = { version = "0.5.1", features = ["async_tokio"] }
memory-stats = "1.0"
strsim = "0.10.0"
futures = "0.3.31"
tracing-subscriber = "0.3.16"
