[package]
name = "llama-helper"
version = "0.1.1"
edition = "2021"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# default-features = false: el default de llama-cpp-2 incluye `openmp`, que en
# MSVC enlaza vcomp140.dll (OpenMP no existe estático) y ese DLL NO viaja en el
# paquete (stage-vcredist.js) → "no se encontró VCOMP140.DLL" en cualquier
# Windows sin VC++ Redist instalado (incidente sep-2026, v0.2.52). Sin OpenMP
# ggml usa su propio thread pool; `with_n_threads` (main.rs) sigue mandando.
# NO revertir a las features por defecto. Guard: frontend/scripts/lint-exe-imports.js
# (cierre CRT de todos los binarios embarcados). Detalle: docs/CANALES_DISTRIBUCION.md.
llama-cpp-2 = { version = "0.1.128", default-features = false }
encoding_rs = "0.8"

[features]
default = []
metal = ["llama-cpp-2/metal"]
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan"]

# Sin [profile.*] aquí: este crate es MIEMBRO del workspace y Cargo ignora los
# profiles de los miembros (warning "profiles for the non root package will be
# ignored"). El perfil de release vive en el Cargo.toml de la raíz (#31 de la
# auditoría de recursos); el bloque que había aquí nunca aplicó.
